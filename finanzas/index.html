<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0D10">
<meta name="color-scheme" content="light">
<meta name="description" content="Control de finanzas personales — ingresos, gastos, deudas y pagos. Funciona sin conexión y guarda todo en tu dispositivo.">
<title>Mis Finanzas</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-logo">$</div>
  <div class="spinner"></div>
</div>

<div id="app" class="app" hidden>
  <main id="screen" class="screen" role="main"></main>
</div>

<nav id="tabbar" class="tabbar" hidden aria-label="Navegación principal"></nav>

<div id="sheet-root"></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
<div id="confetti-root" class="confetti-root" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>
<script>
  // El service worker solo se registra cuando la app se sirve por http(s).
  // Abrirla con file:// sigue funcionando (sin modo sin conexión instalado).
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>

</body>
</html>
