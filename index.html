<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Good Barber — sistema de administración de barbería.">
<title>Good Barber</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='36' fill='%230f1115'/%3E%3Ctext x='96' y='118' font-family='Arial, sans-serif' font-size='72' font-weight='900' fill='%23d4a24e' text-anchor='middle'%3EGB%3C/text%3E%3C/svg%3E">
<!-- iOS ignora manifest.json para el ícono de "Agregar a inicio" — necesita
     su propio <link> con un PNG real (SVG no es fiable en iOS Safari). -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Good Barber">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="connection-banner" class="hidden"></div>

<div id="app">
  <div class="text-center" style="padding-top:120px">
    <div class="spinner" style="margin:auto"></div>
  </div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<div id="loading-overlay" class="hidden">
  <div class="spinner"></div>
  <div class="loading-label">Cargando…</div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<script type="module" src="js/app.js"></script>

<script>
  // Si un service worker nuevo toma el control (hay una versión más nueva
  // desplegada), recargamos una sola vez para que el teléfono muestre el
  // código actualizado en vez de quedarse con el que ya tenía cargado.
  if ("serviceWorker" in navigator) {
    let reloadedForNewWorker = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloadedForNewWorker) return;
      reloadedForNewWorker = true;
      window.location.reload();
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("sw.js")
        .then((registration) => registration.update().catch(() => {}))
        .catch(() => {});
    });
  }
</script>

</body>
</html>
