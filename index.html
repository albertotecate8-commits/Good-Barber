<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>Good Barber</title>

<style>
:root{
  --bg:#f3f3f5;
  --card:#fff;
  --text:#111;
  --muted:#737373;
  --line:#e6e6e8;
  --dark:#101113;
  --accent:#111;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  cursor:pointer;
}

.app{
  max-width:980px;
  margin:auto;
  padding:16px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.brand{
  font-weight:800;
  font-size:24px;
}

.sub{
  color:var(--muted);
  font-size:13px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px #00000008;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.metric{
  background:var(--dark);
  color:white;
  border-radius:14px;
  padding:14px;
}

.metric b{
  display:block;
  font-size:24px;
  margin-top:5px;
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
}

input,
select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:white;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.primary{
  background:#111;
  color:#fff;
}

.secondary{
  background:#eee;
  color:#111;
}

.danger{
  background:#ffe7e7;
  color:#b00020;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:12px;
}

.tabs button{
  white-space:nowrap;
}

.tabs .active{
  background:#111;
  color:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:10px 7px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:14px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.day{
  font-weight:700;
}

.money{
  font-weight:700;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff6d9;
  margin-bottom:12px;
}

.hidden{
  display:none!important;
}

.login{
  max-width:420px;
  margin:60px auto;
}

.status{
  font-size:12px;
  margin-top:7px;
  color:var(--muted);
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .app{
    padding:10px;
  }

  .card{
    padding:13px;
  }

  th,
  td{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="app" class="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/*
 GOOD BARBER
 Sistema automático de registro de cortes.

 Funciones:
 - Selección automática de trabajador
 - Registro de lunes a sábado
 - Cortes diarios
 - Dinero diario
 - 60% trabajador
 - 40% Good Barber
 - Resumen semanal
 - Historial local de respaldo
 - Conexión con Supabase
*/

const LOCAL_KEY="good_barber_data_v3";

const DEFAULT_BARBERS=[
  "Alberto",
  "Joaquín"
];

const DAYS=[
  ["lunes","Lunes"],
  ["martes","Martes"],
  ["miercoles","Miércoles"],
  ["jueves","Jueves"],
  ["viernes","Viernes"],
  ["sabado","Sábado"]
];

let db=null;

let barberos=[];

let currentBarber="";

let weekKey=getWeekKey(new Date());

let records=loadLocal();

let config={};


/* INICIO */

async function init(){

  config=await loadConfig();

  if(
    config.url &&
    config.key &&
    window.supabase
  ){

    try{

      db=window.supabase.createClient(
        config.url,
        config.key
      );

    }catch(e){

      console.warn(e);

    }

  }

  renderLogin();

}


/* CARGAR CONFIGURACIÓN SUPABASE */

async function loadConfig(){

  let c={};

  try{

    if(window.GOOD_BARBER_SUPABASE){

      c=window.GOOD_BARBER_SUPABASE;

    }

  }catch(e){}


  try{

    const r=await fetch(
      "supabase-config.js",
      {
        cache:"no-store"
      }
    );

    if(r.ok){

      const t=await r.text();

      const url=
        (t.match(
          /SUPABASE_URL\s*=\s*["']([^"']+)/
        )||[])[1];

      const key=
        (t.match(
          /SUPABASE_KEY\s*=\s*["']([^"']+)/
        )||[])[1];

      if(url && key){

        c={
          url,
          key
        };

      }

    }

  }catch(e){}

  return c;

}


/* DATOS LOCALES */

function loadLocal(){

  try{

    return JSON.parse(
      localStorage.getItem(LOCAL_KEY)||"{}"
    );

  }catch(e){

    return {};

  }

}


function saveLocal(){

  localStorage.setItem(
    LOCAL_KEY,
    JSON.stringify(records)
  );

}


/* SEMANA */

function getWeekKey(d){

  const x=new Date(d);

  const day=(x.getDay()+6)%7;

  x.setDate(
    x.getDate()-day
  );

  return x.toISOString().slice(0,10);

}


/* DINERO */

function money(n){

  return "$"+
    Number(n||0).toLocaleString(
      "es-MX",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* SEGURIDAD HTML */

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* CLAVE DE REGISTRO */

function recordKey(
  barber,
  day
){

  return weekKey+
    "|"+
    barber+
    "|"+
    day;

}


/* OBTENER REGISTRO */

function getRecord(
  barber,
  day
){

  return records[
    recordKey(
      barber,
      day
    )
  ]||{
    cuts:0,
    total:0
  };

}


/* GUARDAR REGISTRO */

function setRecord(
  barber,
  day,
  cuts,
  total
){

  records[
    recordKey(
      barber,
      day
    )
  ]={
    cuts:Number(cuts)||0,
    total:Number(total)||0
  };

  saveLocal();

}


/* CARGAR BARBEROS */

async function loadBarbers(){

  if(db){

    try{

      const {
        data,
        error
      }=await db
        .from("barberos")
        .select("id,nombre")
        .order("nombre");

      if(
        !error &&
        data?.length
      ){

        barberos=
          data
          .map(x=>x.nombre)
          .filter(Boolean);

        return;

      }

    }catch(e){}

  }

  barberos=[
    ...DEFAULT_BARBERS
  ];

}


/* LOGIN */

function renderLogin(){

  document.getElementById("app").innerHTML=`

    <div class="login">

      <div class="card">

        <div class="brand">
          GOOD BARBER
        </div>

        <div
          class="sub"
          style="margin:4px 0 18px"
        >
          Control de cortes y dinero
        </div>

        <label>
          Trabajador
        </label>

        <select id="loginBarber">

          <option value="">
            Selecciona un trabajador
          </option>

          ${DEFAULT_BARBERS.map(
            x=>`
              <option>
                ${esc(x)}
              </option>
            `
          ).join("")}

        </select>

        <button
          class="primary"
          style="width:100%;margin-top:12px"
          onclick="enterApp()"
        >
          Entrar
        </button>

        <div
          id="loginStatus"
          class="status"
        >
          Cargando trabajadores…
        </div>

      </div>

    </div>

  `;


  loadBarbers().then(()=>{

    const s=
      document.getElementById(
        "loginBarber"
      );

    if(!s)return;

    s.innerHTML=
      `
      <option value="">
        Selecciona un trabajador
      </option>
      `+
      barberos.map(
        x=>`
          <option value="${esc(x)}">
            ${esc(x)}
          </option>
        `
      ).join("");


    document.getElementById(
      "loginStatus"
    ).textContent=
      db
      ?
      "Conectado a Supabase"
      :
      "Modo local de respaldo";

  });

}


/* ENTRAR */

function enterApp(){

  const s=
    document.getElementById(
      "loginBarber"
    );

  if(!s.value){

    alert(
      "Selecciona un trabajador."
    );

    return;

  }

  currentBarber=s.value;

  renderDashboard();

}


/* PANEL PRINCIPAL */

function renderDashboard(){

  const total=
    DAYS.reduce(
      (a,[d])=>
        a+
        Number(
          getRecord(
            currentBarber,
            d
          ).total
        ),
      0
    );


  const cuts=
    DAYS.reduce(
      (a,[d])=>
        a+
        Number(
          getRecord(
            currentBarber,
            d
          ).cuts
        ),
      0
    );


  const worker=
    total*.60;

  const shop=
    total*.40;


  document.getElementById(
    "app"
  ).innerHTML=`

    <div class="top">

      <div>

        <div class="brand">
          GOOD BARBER
        </div>

        <div class="sub">
          ${esc(currentBarber)}
          · Semana del
          ${formatDate(weekKey)}
        </div>

      </div>

      <button
        class="secondary"
        onclick="renderLogin()"
      >
        Cambiar trabajador
      </button>

    </div>


    <div class="card">

      <div class="tabs">

        <button
          class="active"
          onclick="showTab('semana',this)"
        >
          Semana
        </button>

        <button
          onclick="showTab('resumen',this)"
        >
          Resumen
        </button>

      </div>


      <div id="tab-semana"></div>

      <div
        id="tab-resumen"
        class="hidden"
      ></div>

    </div>

  `;


  renderWeek();

  renderSummary();

}


/* CAMBIAR PESTAÑA */

function showTab(
  id,
  btn
){

  document
    .querySelectorAll(
      "[id^=tab-]"
    )
    .forEach(
      x=>x.classList.add(
        "hidden"
      )
    );


  document
    .getElementById(
      "tab-"+id
    )
    .classList.remove(
      "hidden"
    );


  document
    .querySelectorAll(
      ".tabs button"
    )
    .forEach(
      x=>x.classList.remove(
        "active"
      )
    );


  btn.classList.add(
    "active"
  );

}


/* SEMANA */

function renderWeek(){

  const html=
    DAYS.map(
      ([key,label])=>{

        const r=
          getRecord(
            currentBarber,
            key
          );


        return `

          <div class="card">

            <div
              class="row"
              style="justify-content:space-between"
            >

              <div>

                <div class="day">
                  ${label}
                </div>

                <div class="small">

                  ${
                    key==="sabado"
                    ?
                    "Corte y cierre semanal"
                    :
                    "Registro diario"
                  }

                </div>

              </div>


              <div class="money">
                ${money(r.total)}
              </div>

            </div>


            <div
              class="grid"
              style="margin-top:10px"
            >

              <div>

                <label>
                  Cortes
                </label>

                <input
                  id="cuts-${key}"
                  type="number"
                  min="0"
                  value="${r.cuts}"
                >

              </div>


              <div>

                <label>
                  Dinero del día
                </label>

                <input
                  id="total-${key}"
                  type="number"
                  min="0"
                  step="1"
                  value="${r.total}"
                >

              </div>


              <div
                style="display:flex;align-items:end"
              >

                <button
                  class="primary"
                  style="width:100%"
                  onclick="saveDay('${key}')"
                >
                  Guardar día
                </button>

              </div>

            </div>

          </div>

        `;

      }
    ).join("");


  document.getElementById(
    "tab-semana"
  ).innerHTML=
    html+
    `

      <div class="row">

        <button
          class="secondary"
          onclick="clearWeek()"
        >
          Borrar semana
        </button>

        <span class="small">

          Los datos se guardan
          automáticamente en este
          dispositivo.

        </span>

      </div>

    `;

}


/* RESUMEN */

function renderSummary(){

  const total=
    DAYS.reduce(
      (a,[d])=>
        a+
        Number(
          getRecord(
            currentBarber,
            d
          ).total
        ),
      0
    );


  const cuts=
    DAYS.reduce(
      (a,[d])=>
        a+
        Number(
          getRecord(
            currentBarber,
            d
          ).cuts
        ),
      0
    );


  const worker=
    total*.60;

  const shop=
    total*.40;


  document.getElementById(
    "tab-resumen"
  ).innerHTML=`

    <div class="grid">

      <div class="metric">

        <span>
          Cortes
        </span>

        <b>
          ${cuts}
        </b>

      </div>


      <div class="metric">

        <span>
          Total
        </span>

        <b>
          ${money(total)}
        </b>

      </div>


      <div class="metric">

        <span>
          60% trabajador
        </span>

        <b>
          ${money(worker)}
        </b>

      </div>

    </div>


    <div
      class="grid"
      style="margin-top:10px"
    >

      <div class="card">

        <div class="small">
          40% Good Barber
        </div>

        <div class="brand">
          ${money(shop)}
        </div>

      </div>


      <div class="card">

        <div class="small">
          Promedio por corte
        </div>

        <div class="brand">
          ${money(
            cuts
            ?
            total/cuts
            :
            0
          )}
        </div>

      </div>


      <div class="card">

        <div class="small">
          Semana
        </div>

        <div class="brand">
          ${formatDate(weekKey)}
        </div>

      </div>

    </div>


    <div class="card">

      <table>

        <thead>

          <tr>

            <th>
              Día
            </th>

            <th>
              Cortes
            </th>

            <th>
              Total
            </th>

            <th>
              60%
            </th>

            <th>
              40%
            </th>

          </tr>

        </thead>


        <tbody>

          ${DAYS.map(
            ([d,l])=>{

              const r=
                getRecord(
                  currentBarber,
                  d
                );

              const t=
                Number(r.total);


              return `

                <tr>

                  <td>
                    ${l}
                  </td>

                  <td>
                    ${r.cuts}
                  </td>

                  <td>
                    ${money(t)}
                  </td>

                  <td>
                    ${money(t*.6)}
                  </td>

                  <td>
                    ${money(t*.4)}
                  </td>

                </tr>

              `;

            }
          ).join("")}

        </tbody>

      </table>

    </div>

  `;

}


/* GUARDAR DÍA */

function saveDay(day){

  const cuts=
    document.getElementById(
      "cuts-"+day
    ).value;


  const total=
    document.getElementById(
      "total-"+day
    ).value;


  setRecord(
    currentBarber,
    day,
    cuts,
    total
  );


  renderDashboard();


  alert(
    "Guardado correctamente."
  );

}


/* BORRAR SEMANA */

function clearWeek(){

  if(
    !confirm(
      "¿Borrar todos los registros de esta semana para "+
      currentBarber+
      "?"
    )
  ){

    return;

  }


  DAYS.forEach(
    ([d])=>
      delete records[
        recordKey(
          currentBarber,
          d
        )
      ]
  );


  saveLocal();

  renderDashboard();

}


/* FECHA */

function formatDate(s){

  const d=
    new Date(
      s+"T12:00:00"
    );


  return d.toLocaleDateString(
    "es-MX",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* INICIAR */

init();

</script>

</body>
</html>
